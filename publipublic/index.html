<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#215AE2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="고덕이네 채용" />
  <title>고덕이네 채용 서칭기</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">고덕이네</p>
      <h1>채용 자동 서칭기</h1>
    </div>
    <button id="installBtn" class="install-btn hidden" type="button">앱 설치</button>
  </header>

  <main>
    <section class="search-card">
      <div class="quick-chips" aria-label="빠른 검색">
        <button class="chip active" data-keyword="보건관리자" type="button">보건관리자</button>
        <button class="chip" data-keyword="산업간호사" type="button">산업간호사</button>
        <button class="chip" data-keyword="안전관리자" type="button">안전관리자</button>
      </div>
      <div class="search-box">
        <input id="keyword" type="search" value="보건관리자" placeholder="검색 키워드" enterkeyhint="search" />
        <button id="searchBtn" type="button">검색</button>
      </div>
      <p class="source-note">사람인 · 잡코리아 · 인크루트</p>
    </section>

    <p id="status" class="status">키워드를 입력하고 검색을 눌러주세요.</p>
    <ul id="resultList" class="result-list"></ul>
  </main>

  <!-- 공고 확인 / 정보 수정 -->
  <div id="sheetBackdrop" class="sheet-backdrop hidden" aria-hidden="true">
    <section class="sheet sheet-tall" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div>
          <span id="sheetSource" class="src-tag"></span>
          <h2 id="sheetTitle">공고 정보 확인</h2>
        </div>
        <button id="sheetCloseBtn" class="icon-close" type="button" aria-label="닫기">×</button>
      </div>
      <p class="helper">자동으로 못 읽은 항목만 원문을 보고 채워주세요. 입력한 값으로 글과 썸네일이 만들어집니다.</p>

      <div class="form-grid">
        <label class="form-row">회사명<input id="d_company" type="text" placeholder="예: 서울반도체" /></label>
        <label class="form-row">직무명<input id="d_jobLabel" type="text" placeholder="예: 보건관리자" /></label>
        <label class="form-row full">공고 제목<input id="d_title" type="text" /></label>
        <label class="form-row">근무지<input id="d_location" type="text" placeholder="예: 경기 안산시" /></label>
        <label class="form-row">고용형태<input id="d_employment" type="text" placeholder="예: 계약직" /></label>
        <label class="form-row">경력/지원자격<input id="d_experience" type="text" placeholder="예: 경력 2년 이상" /></label>
        <label class="form-row">접수마감<input id="d_deadline" type="text" placeholder="예: 09/17" /></label>
      </div>

      <div class="sheet-actions two-col">
        <button id="openOriginalBtn" class="secondary" type="button">원문 열기</button>
        <button id="draftBtn" type="button">블로그 글 만들기</button>
        <button id="thumbBtn" type="button">썸네일 만들기</button>
      </div>
    </section>
  </div>

  <!-- 블로그 초안 -->
  <div id="draftBackdrop" class="sheet-backdrop hidden" aria-hidden="true">
    <section class="sheet sheet-tall" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>블로그 초안</h2>
        <button id="draftCloseBtn" class="icon-close" type="button" aria-label="닫기">×</button>
      </div>
      <textarea id="draftText" class="draft-textarea"></textarea>
      <div class="sheet-actions">
        <button id="copyDraftBtn" type="button">본문 전체 복사</button>
        <button id="copyNaverBtn" class="naver-btn" type="button">복사하고 네이버 블로그 열기</button>
      </div>
    </section>
  </div>

  <!-- 썸네일 -->
  <div id="thumbBackdrop" class="sheet-backdrop hidden" aria-hidden="true">
    <section class="sheet sheet-tall" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>블로그 썸네일</h2>
        <button id="thumbCloseBtn" class="icon-close" type="button" aria-label="닫기">×</button>
      </div>
      <p class="helper">공고 정보 화면에 입력한 값으로 1080×1080 이미지를 만듭니다.</p>
      <canvas id="thumbCanvas" width="1080" height="1080"></canvas>
      <div class="sheet-actions">
        <button id="regenThumbBtn" class="secondary" type="button">다시 그리기</button>
        <button id="downloadThumbBtn" type="button">이미지 저장</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
